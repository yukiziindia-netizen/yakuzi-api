name: Deploy API on GCP
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add Server Host to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Sync Project Files to GCP Server
        run: |
          rsync -avz --delete --exclude '.git' --exclude 'node_modules' --exclude 'dist' ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/yukizi_india/yakuzi-api/

      - name: Execute Remote Build and Restart Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            cd /home/yukizi_india/yakuzi-api

            echo "Installing dependencies..."
            npm ci

            echo "Syncing database schema with Prisma..."
            npx prisma db push --accept-data-loss

            echo "Generating Prisma Client..."
            npx prisma generate

            echo "Building application..."
            npm run build

            echo "Restarting PM2..."
            pm2 restart yukizi-api || pm2 start dist/src/main.js --name yukizi-api

            pm2 save

            echo "Deployment completed successfully."
