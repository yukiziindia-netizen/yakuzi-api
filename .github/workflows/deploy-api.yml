name: Deploy API on GCP backends
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Project to GCP
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avz --delete --exclude '.git' --exclude 'node_modules' --exclude 'dist'
          path: ./
          remote_path: /home/yukizi_india/yakuzi-api
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Execute Remote Build and Restart Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /home/yukizi_india/yakuzi-api

            echo "Installing dependencies..."
            npm ci

            echo "Generating Prisma Client..."
            npx prisma generate

            echo "Building application..."
            npm run build

            echo "Restarting PM2..."
            pm2 restart yukizi-api

            pm2 save

            echo "Deployment completed successfully."

            pm2 save

            echo "Deployment completed successfully."
