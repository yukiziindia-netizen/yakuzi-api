name: Deploy API on GCP backendsss
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Project to GCP
        uses: burnett01/rsync-deployments@7.0.2
        with:
          # NOTE: --delete removes anything on the server that is not in the repo.
          # The chatbot sidecar's virtualenv (chatbot/.venv) and its runtime state
          # files are created on the server and are NOT tracked in git, so they must
          # be excluded or every deploy wipes them.
          switches: >-
            -avz --delete
            --exclude '.git'
            --exclude 'node_modules'
            --exclude 'dist'
            --exclude '.env'
            --exclude '.venv'
            --exclude '__pycache__'
            --exclude 'chatbot/system_prompt.txt'
            --exclude 'chatbot/current_model.txt'
          path: ./
          remote_path: /home/yukizi_deploy/yakuzi-api
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Execute Remote Build and Restart Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /home/yukizi_deploy/yakuzi-api

            echo "Installing dependencies..."
            npm ci

            echo "Generating Prisma Client..."
            npx prisma generate

            # Apply pending schema migrations BEFORE the new build goes live.
            # Without this step a schema change ships a Prisma client that
            # queries tables the database does not have, while the deploy
            # still shows green. Reads DATABASE_URL from the server .env.
            echo "Applying database migrations..."
            npx prisma migrate deploy

            echo "Building application..."
            npm run build

            # The Python chatbot sidecar is spawned as a child of the API, but it
            # survives `pm2 restart` as an orphan. It keeps port 5005 open, so the
            # API's startup check finds it "healthy" and never replaces it - which
            # means chatbot/main.py changes are never picked up, and a sidecar that
            # has gone bad stays bad across every deploy. Retire it here so the API
            # always relaunches it from the code we just shipped.
            # Retire it by the port it holds, never by a command-line pattern.
            # `pkill -f` also matched this deploy script and terminated it with
            # SIGTERM (exit 143), which skipped the pm2 restart below and left
            # the API serving the previous build while the run looked merely
            # "failed". `|| true` cannot help: a signal is not an exit code.
            # The venv is excluded from the rsync --delete above, so it is
            # created once and then never touched: the sidecar was running
            # whatever package versions existed the day the server was set up,
            # regardless of what requirements.txt asks for. Re-resolve it on
            # every deploy so a requirements change actually ships.
            # Two virtualenvs exist on the server: chatbot/.venv (what the API
            # relaunches from) and the legacy chatbot/venv that the standalone
            # pm2 app `yukizi-chatbot` — the process actually holding port
            # 5005 — was registered with. Syncing only .venv left the live
            # sidecar on the package versions of the day it was created, old
            # enough to drop Optional tool parameters from the Gemini schema.
            # The version echo lands in this deploy log, so the next mismatch
            # is a grep away instead of a day of guessing.
            echo "Syncing chatbot sidecar dependencies..."
            for v in chatbot/.venv chatbot/venv; do
              if [ -x "$v/bin/pip" ]; then
                "$v/bin/pip" install -q -r chatbot/requirements.txt || true
                echo "$v google-genai: $("$v/bin/pip" show google-genai 2>/dev/null | grep '^Version' || echo 'not installed')"
              fi
            done

            # Server hygiene, safe to re-run every deploy: the standalone pm2
            # app `yukizi-chatbot` was registered long ago against chatbot/venv
            # (no dot), which rsync --delete has since half-erased — the app
            # crash-loops (pid N/A) and its interpreter no longer exists. The
            # sidecar's one real home is the API's child process running from
            # chatbot/.venv. Remove the zombie and the debris so deploys stop
            # fighting both.
            pm2 delete yukizi-chatbot >/dev/null 2>&1 || true
            rm -rf chatbot/venv 2>/dev/null || true

            echo "Stopping Python chatbot sidecar (the API relaunches it)..."
            if command -v fuser >/dev/null 2>&1; then
              fuser -k 5005/tcp >/dev/null 2>&1 || true
            else
              # fuser (psmisc) is not on every image; find the listener via ss.
              pid=$(ss -ltnp 2>/dev/null | sed -n 's/.*:5005 .*pid=\([0-9]*\).*/\1/p' | head -1)
              if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; fi
            fi

            echo "Restarting PM2..."
            pm2 restart yakuzi-api

            pm2 save

            echo "Deployment completed successfully."
