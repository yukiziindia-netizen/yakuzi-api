name: Deploy API on GCP backendsss
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Project to GCP
        uses: burnett01/rsync-deployments@7.0.2
        with:
          # NOTE: --delete removes anything on the server that is not in the repo.
          # The chatbot sidecar's virtualenv (chatbot/.venv) and its runtime state
          # files are created on the server and are NOT tracked in git, so they must
          # be excluded or every deploy wipes them.
          switches: >-
            -avz --delete
            --exclude '.git'
            --exclude 'node_modules'
            --exclude 'dist'
            --exclude '.env'
            --exclude '.venv'
            --exclude '__pycache__'
            --exclude 'chatbot/system_prompt.txt'
            --exclude 'chatbot/current_model.txt'
          path: ./
          remote_path: /home/yukizi_deploy/yakuzi-api
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Execute Remote Build and Restart Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /home/yukizi_deploy/yakuzi-api

            echo "Installing dependencies..."
            npm ci

            echo "Generating Prisma Client..."
            npx prisma generate

            echo "Building application..."
            npm run build

            # The chatbot sidecar is a child process of the API, and pm2 restart
            # orphans it rather than stopping it. The orphan keeps port 5005 open
            # and keeps answering the startup health check, so the API decides the
            # sidecar is fine and never replaces it - which is why it has stayed
            # on stale code across every deploy since 5 August.
            #
            # Retiring it here means the API rebuilds it on boot. `|| true` so a
            # deploy never fails just because there was nothing to kill.
            # The bracket keeps this command from matching itself: the pattern
            # matches "chatbot/main.py", while this line contains
            # "[c]hatbot/main.py" and so is not a match. Without it, a shell
            # holding the script on its own command line could be killed too.
            echo "Retiring the chatbot sidecar so it is rebuilt on boot..."
            pkill -f '[c]hatbot/main.py' || true

            echo "Restarting PM2..."
            pm2 restart yakuzi-api

            pm2 save

            echo "Deployment completed successfully."
