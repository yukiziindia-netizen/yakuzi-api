name: Deploy API on GCP backendsss
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Project to GCP
        uses: burnett01/rsync-deployments@7.0.2
        with:
          # NOTE: --delete removes anything on the server that is not in the repo.
          # The chatbot sidecar's virtualenv (chatbot/.venv) and its runtime state
          # files are created on the server and are NOT tracked in git, so they must
          # be excluded or every deploy wipes them.
          switches: >-
            -avz --delete
            --exclude '.git'
            --exclude 'node_modules'
            --exclude 'dist'
            --exclude '.env'
            --exclude '.venv'
            --exclude '__pycache__'
            --exclude 'chatbot/system_prompt.txt'
            --exclude 'chatbot/current_model.txt'
          path: ./
          remote_path: /home/yukizi_deploy/yakuzi-api
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Execute Remote Build and Restart Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /home/yukizi_deploy/yakuzi-api

            echo "Installing dependencies..."
            npm ci

            echo "Generating Prisma Client..."
            npx prisma generate

            # Apply pending schema migrations BEFORE the new build goes live.
            # Without this step a schema change ships a Prisma client that
            # queries tables the database does not have, while the deploy
            # still shows green. Reads DATABASE_URL from the server .env.
            echo "Applying database migrations..."
            npx prisma migrate deploy

            echo "Building application..."
            npm run build

            # The Python chatbot sidecar is spawned as a child of the API, but it
            # survives `pm2 restart` as an orphan. It keeps port 5005 open, so the
            # API's startup check finds it "healthy" and never replaces it - which
            # means chatbot/main.py changes are never picked up, and a sidecar that
            # has gone bad stays bad across every deploy. Retire it here so the API
            # always relaunches it from the code we just shipped.
            # Retire it by the port it holds, never by a command-line pattern.
            # `pkill -f` also matched this deploy script and terminated it with
            # SIGTERM (exit 143), which skipped the pm2 restart below and left
            # the API serving the previous build while the run looked merely
            # "failed". `|| true` cannot help: a signal is not an exit code.
            echo "Stopping Python chatbot sidecar (the API relaunches it)..."
            if command -v fuser >/dev/null 2>&1; then
              fuser -k 5005/tcp >/dev/null 2>&1 || true
            fi
            pm2 restart yukizi-chatbot >/dev/null 2>&1 || true

            echo "Restarting PM2..."
            pm2 restart yakuzi-api

            pm2 save

            echo "Deployment completed successfully."
